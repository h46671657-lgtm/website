name = "vault"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

kv_namespaces = [
  { binding = "VAULT_META", id = "REPLACE_WITH_KV_ID", preview_id = "REPLACE_WITH_KV_PREVIEW_ID" }
]

r2_buckets = [
  { binding = "VAULT_BUCKET", bucket_name = "vault-files", preview_bucket_name = "vault-files-preview" }
]
